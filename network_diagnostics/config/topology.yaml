---
# ADT4 fleet topology (public).
#
# This file has NO network addresses.  Network subnets, each machine's
# `addresses`, and the Silvus radios (`silvus_radios.mgmt_subnet`, `radios`)
# live in the private fleet address overlay, which fleet-adt4 and the
# network_diagnostics scripts deep-merge over this file
# (network_diagnostics/scripts/topology_merge.py).  The overlay is
# fleet_addresses.yaml from the private repo robustrobotics/adt4_fleet_addresses,
# found via --addresses, then $ADT4_FLEET_ADDRESSES, then
# ~/.config/adt4/fleet_addresses/fleet_addresses.yaml:
#
#   git clone git@github.com:robustrobotics/adt4_fleet_addresses.git ~/.config/adt4/fleet_addresses
#   export ADT4_FLEET_ADDRESSES=~/.config/adt4/fleet_addresses/fleet_addresses.yaml
#
# config/fleet_addresses.example.yaml shows its layout.  Never add addresses here.
# Networks, in detection priority order (first subnet match wins); the subnets
# are in the overlay.
networks:
  mit_wifi: {}
  penn_wifi: {}
  silvus: {}
machines:
  euclid:
    role: robot
    platform_id: smaug
    platform_type: spot
    desc: Smaug Jockey
  hamilton:
    role: robot
    platform_id: topaz
    platform_type: spot
    desc: Topaz Jockey
  gauss:
    role: robot
    platform_id: phoenix
    platform_type: phoenix
    desc: Husky Jockey
    # husky team's stack (husky_odom: Ouster, Microstrain, URDF, ptpd, DLIO), started
    # before ADT4; the launch waits for DLIO odometry before run-adt4
    bringup:
      session: husky
      command: ROBOT_NAME=gauss ~/.local/bin/tmuxp load -d ~/ws2/husky_ws/src/husky/tmux/adt4.yaml
      ready_topic: /gauss/dlio/odom_node/odom
      ready_desc: DLIO odometry
      timeout_s: 120
  lewis:
    role: robot
    platform_id: phoenix
    platform_type: phoenix
    desc: Husky Jockey
  apollo:
    role: robot
    platform_id: apollo
    platform_type: spot
    desc: ARL Spot
  samoyed:
    role: robot
    platform_id: samoyed
    platform_type: phoenix
    desc: ARL Husky
  bonsai:
    role: base_station
    desc: RRG dev computer
  willow:
    role: base_station
    desc: RRG base station
  sequia:
    role: base_station
    desc: Sequia base station
silvus_radios:
  # mgmt_subnet and radios (mgmt_ip, node_id) are in the overlay.
  api_endpoint: /cgi-bin/streamscape_api
  udp_telemetry:
    listen_port: 5100
zenoh:
  port: 7447
  connect_network: silvus
  fleetlink_port: 7450  # dedicated fleetlink router on the base (fleet_link: fleetlink)
  fleetlink_networks: [silvus]  # robot agents try these in order (failover)
ssh:
  base_station_user: rrg
  robot_user: swarm
fleet_defaults:
  spot_platforms: [smaug, topaz]
  sessions:
    mapping:
      spot: spot-default
      phoenix: phoenix-default
    relocalize:
      spot: spot_relocalize-relocalize
      phoenix: phoenix_relocalize-relocalize
  base_station_session: base_station_web_repair-default
  output_root: ~/adt4_output
  # router: rmw_zenohd router-to-router over the radio | fleetlink: only fleetlink crosses it
  fleet_link: fleetlink
  fleetlink_base: willow  # base station that runs the fleetlink router
