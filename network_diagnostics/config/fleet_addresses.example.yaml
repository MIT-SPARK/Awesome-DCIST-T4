---
# EXAMPLE of the private fleet address overlay; the addresses are documentation
# ranges (RFC 5737), not the fleet's.  The real file is fleet_addresses.yaml in
# the private repo robustrobotics/adt4_fleet_addresses:
#
#   git clone git@github.com:robustrobotics/adt4_fleet_addresses.git ~/.config/adt4/fleet_addresses
#   export ADT4_FLEET_ADDRESSES=~/.config/adt4/fleet_addresses/fleet_addresses.yaml
#
# Same layout as topology.yaml, which it is deep-merged over
# (scripts/topology_merge.py).  It holds only:
#   networks.<net>.subnet
#   machines.<machine>.addresses
#   silvus_radios.mgmt_subnet
#   silvus_radios.radios.<radio>.{mgmt_ip,node_id}
networks:
  mit_wifi:
    subnet: 198.51.100.0/24
  penn_wifi:
    subnet: 192.0.2.0/24
  silvus:
    subnet: 203.0.113.0/24
machines:
  euclid:
    addresses:
      mit_wifi: 198.51.100.3
      penn_wifi: 192.0.2.3
      silvus: 203.0.113.3
  hamilton:
    addresses:
      mit_wifi: 198.51.100.2
      penn_wifi: 192.0.2.2
      silvus: 203.0.113.2
  gauss:
    addresses:
      mit_wifi: 198.51.100.7
      silvus: 203.0.113.7
  lewis:
    addresses:
      mit_wifi: 198.51.100.5
      penn_wifi: 192.0.2.5
      silvus: 203.0.113.5
  apollo:
    addresses:
      silvus: 203.0.113.13
  samoyed:
    addresses:
      silvus: 203.0.113.62
  bonsai:
    addresses:
      penn_wifi: 192.0.2.100
  willow:
    addresses:
      mit_wifi: 198.51.100.100
      silvus: 203.0.113.100
  sequia:
    addresses:
      mit_wifi: 198.51.100.105
      silvus: 203.0.113.105
silvus_radios:
  # Silvus factory-default management subnet.  A radio's management IP is
  # derived from its node id; these node ids are made up.
  mgmt_subnet: 172.20.0.0/16
  radios:
    radio_100001:
      mgmt_ip: 172.20.134.161
      node_id: 100001
    radio_100002:
      mgmt_ip: 172.20.134.162
      node_id: 100002
