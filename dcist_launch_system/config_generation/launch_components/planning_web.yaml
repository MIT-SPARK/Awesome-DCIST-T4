---
# rviz-free variant of planning for the web console base station (base_station_web*): no RViz or
# RViz-only visualizer panes; the console renders the graph, mesh and plans itself.
nodes_to_monitor:
  omniplanner: {}
windows:
  - window_name: planning
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_omniplanner:=true
    #! - plan commander repl
