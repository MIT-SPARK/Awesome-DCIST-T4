---
windows:
  - window_name: transform_publishers
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:  # TF is namespaced by robot (see master.launch.yaml)
      - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 map $ADT4_ROBOT_NAME/map --ros-args -r /tf_static:=/$ADT4_ROBOT_NAME/tf_static
      - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 $ADT4_ROBOT_NAME/map $ADT4_ROBOT_NAME/odom --ros-args -r /tf_static:=/$ADT4_ROBOT_NAME/tf_static
