---
windows:
  - window_name: console
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      # web console (scene graph / map viewer) on http://<base station>:8090: the live Neo4j
      # map heracles serves, plus the prior map's run directory when there is one.
      # One console per machine: if one already serves :8090 this pane only says so.
      - if ss -ltn 2>/dev/null | grep -q ':8090 '; then echo 'a console already serves :8090; not starting another'; else $ADT4_WS/src/awesome_dcist_t4/adt4_console/bin/adt4-console --port 8090 --neo4j
        live=bolt://${ADT4_HERACLES_IP:-localhost}:${ADT4_HERACLES_PORT:-7687} --live-neo4j live ${ADT4_PRIOR_MAP:+--map=prior=$ADT4_PRIOR_MAP}; fi
