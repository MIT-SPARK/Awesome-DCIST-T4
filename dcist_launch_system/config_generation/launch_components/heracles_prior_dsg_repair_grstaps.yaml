---
# As heracles_prior_dsg_repair, but launches the GRSTAPS-flavoured agent: same
# tools and same message, a prompt that also knows `before` ordering and the
# relocation / inspection goal predicates.
nodes_to_monitor:
  dsg_saver: {}
windows:
  - window_name: prior_dsg
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      # Neo4j is the only map here: the publisher loads the prior map into it
      # on start. To restart this pane mid-run without wiping what has been
      # recorded since, run it with ADT4_NEO4J_SEED=false.
      - ADT4_NEO4J_SEED=${ADT4_NEO4J_SEED:-true} ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_heracles_publisher:=true launch_heracles_state_updater:=true executor_robot_name:=${ADT4_EXECUTOR_ROBOT_NAME:-$ADT4_ROBOT_NAME}
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_saver:=true
      - cd $ADT4_DLS_PKG/../dsg_updater/dsg_updater/examples && source $ADT4_ENV/spark_env/bin/activate && ./update_robot_holding_object_state.py
      - cd $ADT4_DLS_PKG/../heracles_agents/examples/chatdsg_repair_grstaps && source $ADT4_ENV/spark_env/bin/activate && ./chatdsg.py
