---
# ADT4_FLEETLINK_MODE / _CONNECT / _PORT: set by run-adt4 for the session from topology.yaml
# (python -m dcist_launch_system.fleet_env); unset (tmuxp load without run-adt4) = router mode.
windows:
  - window_name: fleetlink_base
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      # fleetlink mode only (fleet_defaults.fleet_link: fleetlink): the radio's zenoh router, which the robot agents dial
      - if [ "$ADT4_FLEETLINK_MODE" = fleetlink ]; then ros2 run fleetlink fleetlink-router ${ADT4_FLEETLINK_PORT:-7450}; else echo "fleetlink-router not started (ADT4_FLEETLINK_MODE=$ADT4_FLEETLINK_MODE,
        router mode)"; fi
      # fleetlink mode only: relays the robots' ROS topics / TF / services into this ROS graph (config/fleetlink/relay.yaml).
      # Robot TF goes where the base reads TF, which is namespaced by robot (see master.launch.yaml)
      - if [ "$ADT4_FLEETLINK_MODE" = fleetlink ]; then ros2 run fleetlink fleetlink-bridge --ros-args -r /tf:=/$ADT4_ROBOT_NAME/tf -r /tf_static:=/$ADT4_ROBOT_NAME/tf_static -p use_sim_time:=$sim_time
        -p zenoh_connect:=${ADT4_FLEETLINK_CONNECT:-tcp/127.0.0.1:7450} -p topology:=${ADT4_TOPOLOGY:-$ADT4_WS/src/awesome_dcist_t4/network_diagnostics/config/topology.yaml} -p relay_config:=$(ros2 pkg
        prefix dcist_launch_system)/share/dcist_launch_system/config/fleetlink/relay.yaml -p base_name:=$ADT4_ROBOT_NAME; else echo "fleetlink-bridge not started (ADT4_FLEETLINK_MODE=$ADT4_FLEETLINK_MODE,
        router mode)"; fi
