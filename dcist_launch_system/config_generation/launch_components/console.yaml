---
# Web console (fleet, map viewer, planning) on http://<base station>:${ADT4_CONSOLE_PORT:-8090}.
# The prior map (ADT4_PRIOR_MAP) is its "prior" map. It refuses a port already in use.
# Set ADT4_CONSOLE_TOKEN to require a token from browsers (see README).
windows:
  - window_name: console
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes: ['ros2 run adt4_console adt4-console ${ADT4_PRIOR_MAP:+--map=prior=$ADT4_PRIOR_MAP}']
