---
nodes_to_monitor:
  dsg_saver: {}
windows:
  - window_name: prior_dsg
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      # Neo4j is the only map here: the publisher loads the prior map into it
      # the first time this pane runs (unless ADT4_NEO4J_SEED=false is set).
      # The command then sets ADT4_NEO4J_SEED=false in this pane's shell, so
      # re-running it mid-run (Ctrl-C, Up, Enter) keeps what has been recorded
      # since. To reseed on purpose: export ADT4_NEO4J_SEED=true and re-run.
      - _seed=${ADT4_NEO4J_SEED:-true}; export ADT4_NEO4J_SEED=false; ADT4_NEO4J_SEED=$_seed ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME
        launch_heracles_publisher:=true launch_heracles_state_updater:=true launch_scene_change_writer:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_saver:=true
      - cd $ADT4_DLS_PKG/../dsg_updater/dsg_updater/examples && source $ADT4_ENV/spark_env/bin/activate && ./update_robot_holding_object_state.py
      - cd $ADT4_DLS_PKG/../heracles_agents/examples/chatdsg_repair && source $ADT4_ENV/spark_env/bin/activate && ./chatdsg.py
      # The AWCD base station compares against the prior map file, not the
      # edited heracles map on hydra/backend/dsg: an applied removal must not
      # drop the object from its prior (that reads as a withdrawn change).
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_awcd_base_station:=true launch_awcd_scene_change_bridge:=true launch_awcd_prior_dsg_publisher:=true
        awcd_prior_dsg_topic:=awcd_base_station/prior_dsg
