---
# Open-vocabulary object search (openset_query): the SAM3 query server that the web
# console's object search talks to (console: SAM3_QUERY_SERVER_URL, default
# http://127.0.0.1:8077; the console hides the feature while it is down). Base station
# only; install with install/python_setup.bash --openset-query (venv $ADT4_ENV/sam3).
# Reads the same live Neo4j map as console_neo4j (ADT4_HERACLES_IP/PORT; credentials
# from HERACLES_NEO4J_USERNAME/PASSWORD, set from ADT4_NEO4J_USERNAME/PASSWORD by the
# session) and the current run's live image-store mirrors. The console writes those
# under its own run's output directory and lists them, with each robot's
# relocalization, in ~/adt4_output/console_live.json (a fixed place: the console runs
# in its own session with another ADT4_OUTPUT_DIR). Only those mirrors are searched,
# placed in the prior map while the robot is relocalized; earlier runs' mirrors never are.
# HF_HUB_OFFLINE=1: model weights come from the local Hugging Face cache only.
windows:
  - window_name: openset_query
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      - if [ -x $ADT4_ENV/sam3/bin/openset-query-server ]; then HF_HUB_OFFLINE=1 HERACLES_NEO4J_URI=bolt://${ADT4_HERACLES_IP:-localhost}:${ADT4_HERACLES_PORT:-7687} $ADT4_ENV/sam3/bin/openset-query-server
        --port ${ADT4_OPENSET_QUERY_PORT:-8077} --conf 0.25 --compile --live-state $HOME/adt4_output/console_live.json; else echo "openset_query not installed (run install/python_setup.bash --openset-query)"; fi
