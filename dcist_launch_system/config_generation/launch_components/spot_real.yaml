---
environment:
  # every Spot camera for the fleetlink agent (fleetlink.yaml `cameras`); relative to /<robot>.
  # Spot cameras come straight from spot_sensors' JPEG topics: stills pass through undecoded and
  # nothing depends on a lazy image_transport republisher noticing a late subscriber.
  ADT4_FLEETLINK_CAMERAS: "['rgb=${ADT4_ROBOT_NAME}_zed/rgb/image_rect_color','overlay=semantic_overlay/image_raw','frontleft=frontleft/color/image_raw/compressed','frontright=frontright/color/image_raw/compressed','left=left/color/image_raw/compressed','right=right/color/image_raw/compressed','back=back/color/image_raw/compressed','hand=hand/color/image_raw/compressed']"
nodes_to_monitor:
  spot_executor: {}
windows:
  - window_name: real_spot
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_executor:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_camera_driver:=true launch_spot_camera_decompression:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_livox:=true
