---
# ADT4_FLEETLINK_MODE / _CONNECT / _PORT: set by run-adt4 for the session from topology.yaml
# (fleet_helpers.fleet_link_env); unset (tmuxp load without run-adt4) = router mode.
# The agent runs in fleetlink mode only and reports to the robot's status monitor (~/node_status);
# in router mode run-adt4 drops fleetlink_agent from the status monitor (_monitor_config).
nodes_to_monitor:
  fleetlink_agent: {}
windows:
  - window_name: fleetlink
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      # robot -> base station (fleetlink mode only): live scene graph, mesh, state and cameras, and the ROS relay
      # (fleetlink/relay.yaml), over the radio to the base's fleetlink router (ADT4_FLEETLINK_CONNECT, a failover list).
      # The topology gives the robot's platform (relay rows); the agent reads the robot's namespaced TF.
      # Mesh: odometric (Hydra's mesh deltas + deformation graph, deformed on the base), so Hydra keeps
      # serialize_dsg_mesh: false; ADT4_FLEETLINK_MESH_SOURCE=dsg needs serialize_dsg_mesh: true.
      - if [ "$ADT4_FLEETLINK_MODE" = fleetlink ]; then ros2 run fleetlink fleetlink-agent --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r "~/node_status:=/$ADT4_ROBOT_NAME/ros_system_monitor/node_diagnostic_collector"
        -r /tf:=/$ADT4_ROBOT_NAME/tf -r /tf_static:=/$ADT4_ROBOT_NAME/tf_static -p robot_name:=$ADT4_ROBOT_NAME -p use_sim_time:=$sim_time -p zenoh_connect:=${ADT4_FLEETLINK_CONNECT:-tcp/127.0.0.1:7447}
        -p mesh_source:=${ADT4_FLEETLINK_MESH_SOURCE:-odometric} -p cameras:="${ADT4_FLEETLINK_CAMERAS:-['rgb=${ADT4_ROBOT_NAME}_zed/rgb/image_rect_color','overlay=semantic_overlay/image_raw']}" -p topology:=${ADT4_TOPOLOGY:-$ADT4_WS/src/awesome_dcist_t4/network_diagnostics/config/topology.yaml}
        -p relay_config:=$(ros2 pkg prefix dcist_launch_system)/share/dcist_launch_system/fleetlink/relay.yaml; else echo "fleetlink-agent not started (ADT4_FLEETLINK_MODE=$ADT4_FLEETLINK_MODE, router mode)";
        fi
