---
dim: 3
method: roman
fusion_method: geometric_mean
submap_radius: 15.0
submap_center_dist: 10.0
submap_center_time: 50.0
submap_max_size: 40
sigma: 0.3
epsilon: 0.5
mindist: 0.4
cosine_min: 0.5
cosine_max: 0.7
force_rm_lc_roll_pitch: true
force_rm_upside_down: true
use_object_bottom_middle: false
submap_descriptor: stacked_frame_descriptors
frame_descriptor_dist: 5.0
submap_descriptor_thresh: 0.7
# loop-closure refinement: point-to-plane ICP on the submaps' depth point clouds
icp_on_submap_pcds: true
icp_voxel_size: 0.1
icp_correspondence_distances: [1.0, 0.5, 0.25, 0.1]
icp_min_fitness: 0.2
icp_max_translation: 1.5
icp_max_rotation_deg: 10.0
