# GA-Nav (RUGD, 6 groups) traversability segmentation
segmenter:
  model:
    model_file: ganav_rugd_group6.onnx
    color:
      mean: [0.485, 0.456, 0.406]
      stddev: [0.229, 0.224, 0.225]
image_resizer:
  width: 640
  height: 360
output:
  recolor:
    groups:
      - name: background
        labels: [0]
      - name: smooth
        labels: [1]
      - name: rough
        labels: [2]
      - name: bumpy
        labels: [3]
      - name: forbidden
        labels: [4]
      - name: obstacle
        labels: [5]
worker:
  max_queue_size: 10
  image_separation_s: 0.0
