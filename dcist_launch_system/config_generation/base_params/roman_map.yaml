---
/**:
  ros__parameters:
    odom_frame_id: $(var robot_name)/odom
    base_flu_frame_id: $(var robot_name)/base_link
    use_multiple_cams: false
    robot_id: 0
    visualize: true
    viz_min_viz_dt: 0.25
    output_roman_map: $(var output_dir)/roman/1.roman_map.pkl
    # mapper params (point-cloud aggregation) and the submap settings shared with loop closure
    config_path: $(find-pkg-share dcist_launch_system)/config/$(var conf_name)/roman_mapper.yaml
    submap_config_path: $(find-pkg-share dcist_launch_system)/config/$(var conf_name)/roman_lc.yaml
    submap_num_segments: 40
    submap_overlapping_segments: 20
    # default T_camera_flu assumes camera frame is right-down-forward (rdf)
