---
/**:
  ros__parameters:
    # every Spot camera; hand is skipped (with a warning) on a Spot without an arm. Only cameras
    # with a subscriber are requested (spot_sensors), so the extra ones cost nothing unwatched.
    cameras: [frontleft, frontright, left, right, back, hand]
    robot:
      setup_logging: false
      should_retry: true
      ip: $(env ADT4_BOSDYN_IP)
      username: $(env ADT4_BOSDYN_USERNAME)
      password: $(env ADT4_BOSDYN_PASSWORD)
