---
/**:
  ros__parameters:
    # mode ("frames" or "all") is set by master.launch.yaml from ADT4_TF_NETWORK_MODE
    # (run-adt4 --forward-all-tf). "frames" only forwards reference_frame -> <robot>/<frame>
    # for each of frames (what the base station looks up); "all" forwards the whole tree
    rate_hz: 10.0
    reference_frame: map
    # frames without a "/" are relative to the robot (base_link -> <robot>/base_link).
    # base_link: omniplanner and heracles robot poses. map: the robot's live scene graph in rviz
    frames: [base_link, map]
    stale_after_s: 2.0
