---
# Image logging for building image-backed maps (Hydra#199, Khronos#48). Hydra and Khronos
# write plain files into the run's output directory (`output_dir`: ADT4_RUN_DIR, passed by
# master.launch.yaml as a config-utilities var); `hydra image-store index RUN`
# (hydra_python.image_store, Hydra#217) builds the queryable image store from them later.
active_window:
  # pass the frames held back by min_output_separation to the keyframe selector only
  # (the pose graph and the other frontend modules are unchanged)
  forward_intermediate_inputs: true
  # per-track observations of every track handed to object extraction, with images of the
  # best observation of each extracted object
  track_logger: {log_path: $<var output_dir>/tracks, max_images_per_object: 1, save_depth: true}
frontend:
  # one InputData archive (color, depth, pose) per keyframe
  keyframe_selector:
    type: KeyframeSelector
    log_path: $<var output_dir>/keyframes
    save_fields: [color, depth]
    keyframe_policy: {type: DistancePolicy, min_pose_separation: 0.25, rotation_separation_weight: 0.0, min_time_separation_s: 0.0, max_time_separation_s: 2.0}
