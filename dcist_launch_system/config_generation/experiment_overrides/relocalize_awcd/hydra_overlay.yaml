---
# Tracking: BoxMOT ids + voxel-IoU fallback, accumulated track geometry and fragment merging.
input:
  inputs:
    camera:
      sensor:
        max_range: 7.0  # far-range depth is biased (underestimated); also caps TSDF/object integration
active_window:
  object_detector:
    max_range: 7.0  # don't let far, depth-biased pixels join object clusters
  khronos_sinks:
    - type: ActiveWindowChangeDetector
      verbosity: 0
      prior_map_path: $<env ADT4_PRIOR_MAP>/hydra/backend/dsg_with_mesh.json
      # Temporal EMA filter params for removed-object detection:
      removal_ema_alpha: 0.2  # EMA smoothing factor (lower = smoother, slower)
      removal_probability_threshold: 0.7  # Smoothed probability to declare removal
      removal_min_frames_observed: 5  # Min frames before removal can be declared
      removal_min_in_bounds_fraction: 0.5  # cheap pre-filter: object voxels in allocated blocks
      removal_min_observed_fraction: 0.5  # object voxels actually observed (tracking last_observed != 0)
      removal_score_weighting: vertices  # 'vertices' (one vote per mesh vertex) or 'voxels' (one per object voxel)
      collect_debug_voxels: true  # per-voxel free/occupied/unknown lists for change_detection/voxels
      # Temporal EMA filter params for newly-added-object detection:
      added_ema_alpha: 0.2  # EMA smoothing factor
      added_probability_threshold: 0.8  # Smoothed probability to declare newly-added
      added_min_frames_observed: 20  # Min frames before a track can be declared added
      added_prune_after_frames: 100  # Frames of no measurement before non-added tracks are pruned
      added_detection_method: mesh  # graph: 2D footprint in prior places; mesh: 3D vs prior mesh
      added_mesh_collision_radius: 0  # mesh: voxels of tolerance around prior mesh surfaces
      global_added_object_deform: false  # false: freeze added objects at their last local pose in the prior
      # ICP configs
      enable_icp_refinement: false
      icp_crop_radius: 10.0
      icp_num_threads: 2
      icp_downsampling_resolution: 0.2
      icp_max_correspondence_distance: 1.0
      icp_max_iterations: 50  # default of 20 doesn't work well for mesh vertices (according to Claude)
      icp_min_inliers: 50
      transformation_getter:
        type: TFTransformationGetter
      start_enabled: false  # press Start (change_detection/start service or RViz panel) once relocalized
      controller: {type: RosChangeDetectionController}  # <robot>/change_detection/{start,stop,reset}
      awcd_sinks:
        - type: TfIcpPublisher
          pre_icp_odom_frame: $<env ADT4_ROBOT_NAME>/pre_icp_odom
        - type: ActiveWindowChangeDetectorPublisher
          robot_name: $<env ADT4_ROBOT_NAME>
          global_frame_name: map  # default is the GlobalInfo map frame (<robot>/odom in relocalize)
        - type: ActiveWindowChangeDetectorVisualizer
          verbosity: 1
          global_frame_name: map
          min_draw_period_s: 0.5
          draw_graph: false  # prior mesh only; drawing the graph needs a `renderer:` config
          draw_mesh: true
