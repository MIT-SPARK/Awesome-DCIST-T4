---
model:
  # Erode instance masks (semantic_inference SegmentRefinement) to pull edges off the background.
  use_refinement: true
  refinement:
    dilate_masks: true  # enables the morphology step
    erode_only: true  # erode only (default would erode then dilate back, i.e. an opening)
    kernel_size: 5  # each pass shrinks masks by (kernel_size - 1) / 2 = 2 px
    passes: 1  # number of erosion passes
