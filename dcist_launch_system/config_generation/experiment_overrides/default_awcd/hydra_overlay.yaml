input:
  inputs:
    camera:
      sensor:
        max_range: 7.0  # far-range depth is biased (underestimated); also caps TSDF/object integration
active_window:
  verbosity: 0
  object_detector:
    max_range: 7.0  # don't let far, depth-biased pixels join object clusters
    outlier_filter:
      enabled: false
  #   min_object_volume: -1
  #   min_cluster_size: 1
    ### voxel tracking with boxmot on ###
  # tracker: !reset
  #   type: MaxIouTracker
  #   preassociate_by_id: true  # trust BoxMOT instance ids first, fall back to geometric IoU
  #   min_num_observations: 10
  #   verbosity: 5
  #   track_by: voxels
  #   voxel_size: 0.1
  #   min_semantic_iou: 0.25
  #   min_cross_iou: 0.1
  #   bbox_type: aabb
    ### default config with boxmot off ###
  tracker:
    preassociate_by_id: true  # BoxMOT ids first, voxel-IoU fallback for unmatched clusters
    track_by: voxels  # default is pixels
    voxel_size: 0.1
    min_semantic_iou: 0.1
    accumulate_voxels: true  # accumulate all observations' voxels into Track::accumulated_* (association unchanged)
    min_voxel_hits: 15  # observations a voxel needs to count in the accumulated bbox/footprint
    merge_tracks: true  # merge fragment tracks of one object (needs accumulate_voxels); older id survives
    merge_containment_threshold: 0.2  # fraction of the smaller track's confirmed voxels inside the other
    merge_distance_factor: 2.0  # max center distance, in multiples of the larger track radius
    ### only boxmot, maxioutracker will be a noop ###
  # tracker:
  #   preassociate_by_id: true  # BoxMOT instance id is the only association signal
  #   # semantic_association: assign_track  # accepts iou >= min_semantic_iou, so only a perfect match
  #   min_semantic_iou: 1.0  # max allowed by config check; geometric fallback effectively disabled
  #   min_cross_iou: 1.0     # cross-association needs iou > 1.0, never true (no dynamic tracks anyway)
  frame_data_buffer:
    max_buffer_size: 600
    store_every_n_frames: 1
    # store_every_n_frames: 2  # same 300-frame memory, ~2x time span (needs FrameDataBuffer fix)
  object_extractor:
    max_object_volume: 20.0  # cars/trucks exceed the default 4 m^3
    bbox_type: aabb         # rotated box hugs diagonally parked vehicles
  # vote_filter:
  #   enabled: false  # prune depth-smeared observations at inactivity (see ObservationVoteFilter)
  # khronos_sinks:
  #   - type: ActiveWindowTrackSaver
  #     output_directory: $<env ADT4_OUTPUT_DIR>/track_debug
  #     save_pointcloud: true

frontend:
  clear_object_meshes: false
map_window: {type: spatial, max_radius_m: 10.0}