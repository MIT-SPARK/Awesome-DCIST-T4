---
# relocalize_awcd on a fused multi-robot prior (run-fusion-from-trajectories): the
# prior's robots 1..N keep their own trajectory ids (otherwise the prior's forced
# robot id collides with robot 1's keys, gtsam ValuesKeyAlreadyExists "b0"), and the
# live robot frame is pre_icp_odom for change detection. A config group can't combine
# overlays (the generator only collects leaf overlays), so this config stands alone.
robots: !update
  - inputs:
      dgraph:
        keep_robot_ids: true  # robots 1..N keep their own trajectories
  - robot_frame: $<var robot_name>/pre_icp_odom  # hydra_multi publishes map_T_<robot>/pre_icp_odom
