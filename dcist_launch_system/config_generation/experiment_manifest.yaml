---
# Launch configs build the structure of the tmux launch files
launch_configs:
  # core groupings
  main: [core, status]
  # robots also send reduced-rate TF to the base station
  robot_main: [main, tf_network]
  # fleetlink: the robot's fleetlink agent (+ ROS relay in fleetlink mode)
  map: [robot_main, hydra, roman, fleetlink]
  relocalize: [robot_main, hydra_multi, roman, fleetlink]
  # development groupings
  bag_map: [map, rviz]
  bag_relocalize: [relocalize, rviz, relocalize_viz]
  # planning and base station
  plan_prior: [main, prior_dsg, planning]
  plan_prior_heracles: [main, heracles_prior_dsg, planning]
  plan_prior_repair: [main, prior_dsg, planning_repair]
  plan_prior_heracles_repair: [main, heracles_prior_dsg_repair, planning_repair]
  # web console instead of RViz (rviz-free base station: no RViz or RViz-only visualizer nodes)
  plan_prior_web: [main, prior_dsg_web, planning_web]
  plan_prior_web_heracles_repair: [main, heracles_prior_dsg_repair_web, planning_repair_web]
# Configs build the set of rosparams that will be loaded
configs:
  default: []
  indoor: []
  prior_dsg: []
  regions: []
  regions_traversability: [regions]
  relocalize: []
  relocalize_awcd: [relocalize]
  indoor_regions: [indoor, regions]
  image_logging: []
  # indoor ranges/windows + image logging (keyframe archives and tracks for the image store)
  indoor_image_logging: [indoor, image_logging]
# Variant names shown first in run-adt4 session selection
important_variants:
  - base_station-default
  - base_station_heracles-default
  - base_station_web-default
  - base_station_web_repair-default
  - phoenix-default
  - phoenix_relocalize-relocalize
  - spot-default
  - spot_relocalize-relocalize
# Experiments define which sets of parameters will be used with which sets of launch files
experiments:
  # base station — these run on the base station only (no robot hardware needed).
  # fleetlink_base (fleetlink router + bridge, fleetlink mode only) is added here rather than to
  # plan_prior*, which the single-machine spot_* simulations below also use.
  base_station:
    launch_config: [plan_prior, multi_status, tf_relay, fleetlink_base, console]
    config: [default]
  # Console only (no prior map, no planner): the minimum to launch and watch robots from the web
  # console - the console (on the base station's Neo4j map, like the base_station_*heracles*/web_repair
  # consoles) and the fleetlink router + bridge the robots dial in to. Started by
  # start-adt4-console in its own tmux session (adt4_console); a base_station_* session can be
  # started beside it later (it does not start a second console, router or bridge).
  base_station_console:
    launch_config: [fleetlink_base, console_neo4j]
    config: [default]
  # web console base stations (no RViz): planning on a prior map, viewed and commanded from the console
  base_station_web:
    launch_config: [plan_prior_web, multi_status, tf_relay, fleetlink_base, console]
    config: [default]
  # + heracles (prior map in Neo4j), plan repair and SAM3 object search
  base_station_web_repair:
    launch_config: [plan_prior_web_heracles_repair, multi_status, tf_relay, fleetlink_base, console_neo4j, openset_query]
    config: [default]
  base_station_heracles:
    launch_config: [plan_prior_heracles, multi_status, tf_relay, fleetlink_base, console_neo4j, openset_query]
    config: [default]
  base_station_repair:
    launch_config: [plan_prior_repair, multi_status, tf_relay, fleetlink_base, console]
    config: [default]
  base_station_heracles_repair:
    launch_config: [plan_prior_heracles_repair, multi_status, tf_relay, fleetlink_base, console_neo4j, openset_query]
    config: [default]

  # spot configs — require Spot hardware or bag playback
  spot:
    launch_config: [map, spot_real, sensors]
    config: [default, indoor, image_logging, indoor_image_logging]
  spot_relocalize:
    launch_config: [relocalize, spot_real, sensors]
    config: [relocalize, relocalize_awcd]
  spot_regions:
    launch_config: [robot_main, roman, hydra_regions, spot_real, sensors, fleetlink]
    config: [indoor_regions]
  spot_regions_traversability:
    launch_config: [robot_main, roman, hydra_regions_traversability, spot_real, sensors, fleetlink]
    config: [regions_traversability]
  spot_data_collection:
    launch_config: [robot_main, spot_real, sensors]
    config: [default]
  spot_bag:
    launch_config: [bag_map, spot_bag]
    config: [default, indoor, image_logging, indoor_image_logging]
  spot_bag_relocalize:
    launch_config: [bag_relocalize, spot_bag]
    config: [relocalize, relocalize_awcd]
  spot_bag_regions:
    launch_config: [robot_main, roman, hydra_regions, rviz, spot_bag, fleetlink]
    config: [indoor_regions]
  spot_bag_regions_traversability:
    launch_config: [robot_main, roman, hydra_regions_traversability, rviz, spot_bag, fleetlink]
    config: [regions_traversability]

  # phoenix — require Phoenix hardware or bag playback
  phoenix:
    launch_config: [map, phoenix_real, sensors]
    config: [default, image_logging]
  phoenix_relocalize:
    launch_config: [relocalize, phoenix_real, sensors]
    config: [relocalize, relocalize_awcd]
  phoenix_data_collection:
    launch_config: [robot_main, phoenix_real, sensors]
    config: [default]
  phoenix_bag:
    launch_config: bag_map
    config: [default, image_logging]
  phoenix_bag_relocalize:
    launch_config: bag_relocalize
    config: [relocalize, relocalize_awcd]

  # development — offline/simulation experiments
  # a simulated Spot (FakeSpot executor) with the fleetlink agent: plan -> result over
  # fleetlink without the real robot
  spot_sim_fleetlink:
    launch_config: [robot_main, spot_sim, fleetlink]
    config: [default]
  spot_prior_dsg:
    launch_config: [plan_prior, spot_sim]
    config: [prior_dsg]
  spot_prior_dsg_heracles:
    launch_config: [plan_prior_heracles, spot_sim]
    config: [prior_dsg]
  spot_prior_dsg_repair:
    launch_config: [plan_prior_repair, spot_sim]
    config: [prior_dsg]
  spot_prior_dsg_heracles_repair:
    launch_config: [plan_prior_heracles_repair, spot_sim]
    config: [prior_dsg]
