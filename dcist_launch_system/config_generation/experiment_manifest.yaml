---
# Launch configs build the structure of the tmux launch files
launch_configs:
  # core groupings
  main: [core, status]
  map: [main, hydra, roman]
  relocalize: [main, hydra_multi, roman]
  # development groupings
  map_old: [main, hydra_old, roman]
  no_relocalize: [main, transform_publishers]
  bag_map: [map, rviz]
  bag_relocalize: [relocalize, rviz, relocalize_viz]
  # planning and base station
  plan_prior: [main, prior_dsg, planning]
  plan_prior_heracles: [main, heracles_prior_dsg, planning]
  plan_prior_repair: [main, prior_dsg, planning_repair]
  plan_prior_heracles_repair: [main, heracles_prior_dsg_repair, planning_repair]
  # Same repair flow, but the goal manager forwards to the GRSTAPS-X plugin.
  plan_prior_repair_grstaps: [main, prior_dsg, planning_repair_grstaps]
  plan_prior_heracles_repair_grstaps: [main, heracles_prior_dsg_repair_grstaps, planning_repair_grstaps]
# Configs build the set of rosparams that will be loaded
configs:
  default: []
  classic: []
  indoor: []
  prior_dsg: []
  regions: []
  relocalize: []
  relocalize_awcd: [relocalize]
  apollo_relocalize: [relocalize]
  indoor_regions: [indoor, regions]
  grstaps: [prior_dsg]
  # Same planner, but listening for the repair flow's ConstrainedPddlGoalMsg
  # instead of a plain point list. Kept as its own config rather than inheriting
  # grstaps: resolve_override_dirs only collects leaf keys, so a non-leaf parent
  # contributes no overrides and the overlay has to stand alone anyway.
  grstaps_repair: [prior_dsg]
# Variant names shown first in run-adt4 session selection
important_variants:
  - base_station-default
  - base_station_heracles-default
  - phoenix-default
  - phoenix_relocalize-relocalize
  - spot-default
  - spot_relocalize-relocalize
# Experiments define which sets of parameters will be used with which sets of launch files
experiments:
  # base station — these run on the base station only (no robot hardware needed)
  base_station:
    launch_config: [plan_prior, multi_status]
    config: [default]
  base_station_heracles:
    launch_config: [plan_prior_heracles, multi_status]
    config: [default]
  base_station_repair:
    launch_config: [plan_prior_repair, multi_status]
    config: [default]
  base_station_heracles_repair:
    launch_config: [plan_prior_heracles_repair, multi_status]
    config: [default]

  # spot configs — require Spot hardware or bag playback
  spot:
    launch_config: [map, spot_real, sensors]
    config: [default]
  spot_relocalize:
    launch_config: [relocalize, spot_real, sensors]
    config: [relocalize, apollo_relocalize, relocalize_awcd]
  spot_regions:
    launch_config: [main, roman, hydra_regions, spot_real, sensors]
    config: [regions, indoor_regions]
  spot_data_collection:
    launch_config: [main, spot_real, sensors]
    config: [default]
  spot_bag:
    launch_config: [bag_map, spot_bag]
    config: [default, indoor]
  spot_bag_relocalize:
    launch_config: [bag_relocalize, spot_bag]
    config: [relocalize, relocalize_awcd]
  spot_bag_regions:
    launch_config: [main, roman, hydra_regions, rviz, spot_bag]
    config: [regions, indoor_regions]
  spot_no_relocalize:
    launch_config: [no_relocalize, spot_real, sensors]
    config: [relocalize]

  # phoenix — require Phoenix hardware or bag playback
  phoenix:
    launch_config: [map, phoenix_real, sensors]
    config: [default]
  phoenix_relocalize:
    launch_config: [relocalize, phoenix_real, sensors]
    config: [relocalize, relocalize_awcd]
  phoenix_data_collection:
    launch_config: [main, phoenix_real, sensors]
    config: [default]
  phoenix_bag:
    launch_config: bag_map
    config: [default]
  phoenix_bag_relocalize:
    launch_config: bag_relocalize
    config: [relocalize, relocalize_awcd]
  phoenix_no_relocalize:
    launch_config: [no_relocalize, sensors]
    config: [relocalize]

  # scene graphs with mesh places and dense 2d segmentation
  spot_old:
    launch_config: [map_old, spot_real, sensors]
    config: [classic]
  phoenix_old:
    launch_config: [map_old, phoenix_real, sensors]
    config: [classic]

  # development — offline/simulation experiments
  spot_grstaps:
    launch_config: [plan_prior, spot_sim]
    config: [grstaps]
  spot_grstaps_repair:
    launch_config: [plan_prior_repair_grstaps, spot_sim]
    config: [grstaps_repair]
  spot_grstaps_heracles_repair:
    launch_config: [plan_prior_heracles_repair_grstaps, spot_sim]
    config: [grstaps_repair]
  base_station_grstaps_heracles_repair:
    launch_config: [plan_prior_heracles_repair_grstaps, multi_status]
    config: [grstaps_repair]
  spot_prior_dsg:
    launch_config: [plan_prior, spot_sim]
    config: [prior_dsg]
  spot_prior_dsg_heracles:
    launch_config: [plan_prior_heracles, spot_sim]
    config: [prior_dsg]
  spot_prior_dsg_repair:
    launch_config: [plan_prior_repair, spot_sim]
    config: [prior_dsg]
  spot_prior_dsg_heracles_repair:
    launch_config: [plan_prior_heracles_repair, spot_sim]
    config: [prior_dsg]
