paths: [khronos, khronos_ros]
robot_id: 0
config_verbosity: 1
map_frame: $<env ADT4_ROBOT_NAME>/map
odom_frame: $<env ADT4_ROBOT_NAME>/odom
robot_frame: $<env ADT4_ROBOT_NAME>/base_link
map_window: {type: spatial, max_radius_m: 14.0}
labelspace: {type: from_msg}
input:
  type: RosInput
  inputs:
    camera:
      sensor:
        type: camera_info
        min_range: 0.2
        max_range: 10.0
        extrinsics: {type: ros}
      receiver:
        type: ImageReceiver
        verbosity: 1
        semantics_type: instance
        use_exact: true
        queue_size: 30
        filters:
          - {type: InvalidDepthFilter, max_invalid_ratio: 0.5}
        with_feature: true
active_window:
  type: ActiveWindow
  min_output_separation: 0.5
  volumetric_map: {voxel_size: 0.1, truncation_distance: 0.3, with_semantics: false}
  projective_integrator:
    semantic_integrator: {type: SingleLabelIntegrator}
  object_detector:
    type: InstanceForwarding
    min_cluster_size: 30
    max_range: 10.0
    min_range: 0.05
    verbosity: 1
    instance_filter: {type: CategoryFilter}
  tracker: {type: MaxIouTracker, track_by: pixels, min_semantic_iou: 0.25, min_cross_iou: 0.1, min_num_observations: 10, verbosity: 0}
  object_extractor:
    type: MeshObjectExtractor
    projective_integrator: {num_threads: 8}
    object_reconstruction_resolution: -0.05
  khronos_sinks:
    - {type: ActiveWindowVisualizer}
  sinks:
    - {type: ReconstructionVisualizer}
    - {type: TsdfOccupancyPublisher, min_distance: 0.25, use_relative_height: true, slice_height: 0.25, num_slices: 4}
frontend:
  type: GraphBuilder
  serialize_dsg_mesh: false
  clear_object_meshes: true
  enable_mesh_objects: false
  pgmo: {time_horizon: 15.0, d_graph_resolution: 2.5}
  mesh_compression: {resolution: 0.005}
  graph_connector:
    layers:
      - parent_layer: MESH_PLACES
        child_layers:
          - {layer: OBJECTS}
  graph_updater:
    layer_updates:
      OBJECTS:
        prefix: O
        matcher: {type: IoUNodeMatcher, min_same_iou: 0.2, min_cross_iou: 0.5}
  traversability_places:
    type: traversability
    layer: MESH_PLACES
    estimator:
      type: GradientTraversabilityEstimator
      gradient_threshold: 0.5
      height_below: 1.0
      height_above: 0.5
      min_confidence: 0.5
      min_traversability: 0.1
      pessimistic: true
      smoothing: true
    clustering: {type: RegionGrowingTraversabilityClustering, max_radius: 4.0}
    sinks:
      - type: TraversabilityVisualizer
  keyframe_selector:
    feature_selector: {type: average, max_range_difference_m: 0.5}
backend:
  type: BackendModule
  publish_backend_tf: true
  serialize_dsg_mesh: false
  min_dsg_separation_s: 1
  publish_mesh: true
  min_mesh_separation_s: 10
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects:
      type: GenericUpdateFunctor
      layer: OBJECTS
      node_matcher: {type: IoUNodeMatcher, min_same_iou: 0.1, min_cross_iou: 0.3}
      merge_proposer:
        strategy: {type: Pairwise}
    traversability: {type: UpdateRegionGrowingTraversabilityFunctor, layer: MESH_PLACES}
    regions:
      type: OpenVocabRegionsUpdateFunctor
      source_layer: MESH_PLACES
      clustering:
        type: AgglomerativeIBClustering
        verbosity: 1
        max_delta: 0.02
        score_threshold: 0.21
        top_k: 2
        cumulative: true
        null_task_preprune: true
        queries:
          type: RosEmbeddingGroup
          ns: ~/regions
          verbosity: 1
          prompts: [parking lot, building, intersection, field, bridge, road]
  pgmo:
    run_mode: FULL
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc: {inlier_probability: 0.9, mu_step: 1.6, max_iterations: 100}
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-02
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
