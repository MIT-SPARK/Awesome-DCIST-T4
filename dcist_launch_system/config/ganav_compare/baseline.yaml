# Current GA-Nav (6-class RUGD group6), collapsed to the 3 traversability classes
# with GROUP6_TO_TRAV3 so it can be compared label-for-label with the trav3 models.
segmenter:
  model:
    model_file: ganav_rugd_group6.onnx
    color:
      mean: [0.485, 0.456, 0.406]
      stddev: [0.229, 0.224, 0.225]
image_resizer:
  width: 640
  height: 360
output:
  recolor:
    groups:
      - name: traversable
        labels: [1, 2]  # smooth, rough
      - name: maybe
        labels: [3]  # bumpy
      - name: not_traversable
        labels: [0, 4, 5]  # background, forbidden, obstacle
worker:
  max_queue_size: 10
  image_separation_s: 0.0
