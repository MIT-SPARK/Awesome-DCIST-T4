# 3-class traversability GA-Nav (exported with GANav-offroad/tools/dcist/export_onnx.py).
# model_file is set from the launch file.
segmenter:
  model:
    color:
      mean: [0.485, 0.456, 0.406]
      stddev: [0.229, 0.224, 0.225]
image_resizer:
  width: 640
  height: 360
output:
  recolor:
    groups:
      - name: traversable
        labels: [0]
      - name: maybe
        labels: [1]
      - name: not_traversable
        labels: [2]
worker:
  max_queue_size: 10
  image_separation_s: 0.0
