paths: [khronos, khronos_ros]
robot_id: 0
config_verbosity: 1
map_frame: $<env ADT4_ROBOT_NAME>/map
odom_frame: $<env ADT4_ROBOT_NAME>/odom
robot_frame: $<env ADT4_ROBOT_NAME>/base_link
map_window: {type: spatial, max_radius_m: 14.0}
labelspace: {type: from_msg}
input:
  type: RosInput
  max_receiver_queue_size: 1
  inputs:
    camera:
      receiver:
        type: InstanceImageReceiver
        verbosity: 1
        queue_size: 30
        filters:
          - {type: InvalidDepthFilter, max_invalid_ratio: 0.3}
      sensor:
        type: camera_info
        min_range: 0.2
        max_range: 10.0
        extrinsics: {type: ros}
active_window:
  type: ActiveWindow
  min_output_separation: 0.5
  volumetric_map: {voxels_per_side: 16, voxel_size: 0.1, truncation_distance: 0.3, with_semantics: false}
  projective_integrator:
    semantic_integrator: {type: SingleLabelIntegrator}
  object_detector:
    type: InstanceForwarding
    min_cluster_size: 30
    max_range: 10.0
    min_range: 0.05
    verbosity: 1
    instance_filter: {type: CategoryFilter}
  tracker: {type: MaxIouTracker, track_by: pixels, min_semantic_iou: 0.25, min_cross_iou: 0.1, min_num_observations: 10, verbosity: 0}
  object_extractor:
    type: MeshObjectExtractor
    projective_integrator: {num_threads: 8}
    object_reconstruction_resolution: -0.05
  khronos_sinks:
    - type: ActiveWindowVisualizer
  sinks:
    - {type: ReconstructionVisualizer}
    - {type: TsdfOccupancyPublisher, min_distance: 0.25, use_relative_height: true, slice_height: 0.25, num_slices: 4}
frontend:
  type: GraphBuilder
  enable_mesh_objects: false
  serialize_dsg_mesh: false
  clear_object_meshes: true
  pgmo: {time_horizon: 15.0, d_graph_resolution: 2.5, mesh_resolution: 0.005}
  graph_connector:
    layers:
      - parent_layer: MESH_PLACES
        child_layers:
          - {layer: OBJECTS}
  graph_updater:
    layer_updates:
      OBJECTS:
        prefix: O
        matcher: {type: IoUNodeMatcher, min_same_iou: 0.2, min_cross_iou: 0.5}
  traversability_places:
    type: traversability
    layer: MESH_PLACES
    estimator: {type: HeightTraversabilityEstimator, height_below: 0, height_above: 0.5, min_confidence: 1.0, min_traversability: 1.0, pessimistic: true}
    clustering: {type: RegionGrowingTraversabilityClustering, max_radius: 4.0, num_orientation_bins: 20}
    sinks:
      - type: TraversabilityVisualizer
backend:
  type: BackendModule
  enable_zmq_interface: false
  publish_backend_tf: true
  serialize_dsg_mesh: false
  min_dsg_separation_s: 1
  publish_mesh: true
  min_mesh_separation_s: 1
  add_places_to_deformation_graph: false
  optimize_on_lc: true
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects:
      type: GenericUpdateFunctor
      layer: OBJECTS
      node_matcher: {type: IoUNodeMatcher, min_same_iou: 0.1, min_cross_iou: 0.3}
      merge_proposer:
        strategy: {type: Pairwise}
    traversability: {type: UpdateRegionGrowingTraversabilityFunctor, layer: MESH_PLACES}
  pgmo:
    run_mode: FULL
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc: {inlier_probability: 0.9, mu_step: 1.6, max_iterations: 100}
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-02
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
