nodes_to_monitor:
  tf_network: {}
  hydra:
    external_monitor:
      type: JsonMonitor
  semantic_inference:
    external_monitor:
      type: JsonMonitor
  depth_correction: {}
  zed_depth_quality: {}
  fastsam: {}
  roman_map: {}
  roman_lc: {}
  relocalization_monitor:
    external_monitor:
      type: RelocalizationMonitor
  fleetlink_agent: {}
  nlu_rviz_instruction_panel: {}
  nlu_rviz_manipulation_panel: {}
session_name: adt4_system
suppress_history: false
environment:
  sim_time: $ADT4_SIM_TIME
  ADT4_PRIOR_MAP: $ADT4_PRIOR_MAP
  ADT4_OUTPUT_DIR: $ADT4_OUTPUT_DIR
  HERACLES_NEO4J_USERNAME: $ADT4_NEO4J_USERNAME
  HERACLES_NEO4J_PASSWORD: $ADT4_NEO4J_PASSWORD
  HERACLES_OPENAI_API_KEY: $ADT4_OPENAI_API_KEY
  HERACLES_EVALUATION_PATH: $ADT4_HERACLES_AGENTS_PATH
  ADT4_ORIGIN_UTM: $ADT4_ORIGIN_UTM
  ADT4_TF_NETWORK_MODE: $ADT4_TF_NETWORK_MODE
  ADT4_MONITOR_CONFIG: '{nodes_to_track: {depth_correction: {}, fastsam: {}, fleetlink_agent: {}, hydra: {external_monitor: {type: JsonMonitor}}, nlu_rviz_instruction_panel: {}, nlu_rviz_manipulation_panel: {}, relocalization_monitor: {external_monitor: {type: RelocalizationMonitor}}, roman_lc: {}, roman_map: {}, semantic_inference: {external_monitor: {type: JsonMonitor}}, tf_network: {}, zed_depth_quality: {}}}'
  ADT4_ROBOT_NAME: $ADT4_ROBOT_NAME
  config: indoor
  logging_key: spot_bag-indoor
options:
  default-command: /bin/zsh
windows:
- window_name: core
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 service call /${ADT4_ROBOT_NAME}/hydra/shutdown std_srvs/Empty && ros2 service call /${ADT4_ROBOT_NAME}/roman/shutdown std_srvs/Empty''"''"'' ADT4_PANE_PREFILL=1 exec zsh'''
- window_name: status
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 run ros_system_monitor ros_system_monitor --params "$ADT4_MONITOR_CONFIG" --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r ''"''"''~/table_out:=/global/ros_system_monitor/table_in''"''"''; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 run ros_system_monitor ros_system_monitor --params "$ADT4_MONITOR_CONFIG" --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r ''"''"''"''"''"''"''"''"''~/table_out:=/global/ros_system_monitor/table_in''"''"''"''"''"''"''"''"''''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true''"''"'' exec zsh'''
- window_name: tf_network
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tf_network:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tf_network:=true''"''"'' exec zsh'''
- window_name: hydra
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_instance_segmentation:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_instance_segmentation:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_static_map_to_robot_map:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_static_map_to_robot_map:=true''"''"'' exec zsh'''
- window_name: roman
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_depth_correction:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_depth_correction:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_fastsam:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_fastsam:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_map:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_map:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_lc:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_lc:=true''"''"'' exec zsh'''
- window_name: fleetlink
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && if [ "$ADT4_FLEETLINK_MODE" = fleetlink ]; then ros2 run fleetlink fleetlink-agent --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r "~/node_status:=/$ADT4_ROBOT_NAME/ros_system_monitor/node_diagnostic_collector" -r /tf:=/$ADT4_ROBOT_NAME/tf -r /tf_static:=/$ADT4_ROBOT_NAME/tf_static -p robot_name:=$ADT4_ROBOT_NAME -p use_sim_time:=$sim_time -p zenoh_connect:=${ADT4_FLEETLINK_CONNECT:-tcp/127.0.0.1:7447} -p mesh_source:=${ADT4_FLEETLINK_MESH_SOURCE:-odometric} -p cameras:="${ADT4_FLEETLINK_CAMERAS:-[''"''"''rgb=${ADT4_ROBOT_NAME}_zed/rgb/image_rect_color''"''"'',''"''"''overlay=semantic_overlay/image_raw''"''"'']}" -p topology:=${ADT4_TOPOLOGY:-$ADT4_WS/src/awesome_dcist_t4/network_diagnostics/config/topology.yaml} -p relay_config:=$(ros2 pkg prefix dcist_launch_system)/share/dcist_launch_system/fleetlink/relay.yaml; else echo "fleetlink-agent not started (ADT4_FLEETLINK_MODE=$ADT4_FLEETLINK_MODE, router mode)"; fi; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''if [ "$ADT4_FLEETLINK_MODE" = fleetlink ]; then ros2 run fleetlink fleetlink-agent --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r "~/node_status:=/$ADT4_ROBOT_NAME/ros_system_monitor/node_diagnostic_collector" -r /tf:=/$ADT4_ROBOT_NAME/tf -r /tf_static:=/$ADT4_ROBOT_NAME/tf_static -p robot_name:=$ADT4_ROBOT_NAME -p use_sim_time:=$sim_time -p zenoh_connect:=${ADT4_FLEETLINK_CONNECT:-tcp/127.0.0.1:7447} -p mesh_source:=${ADT4_FLEETLINK_MESH_SOURCE:-odometric} -p cameras:="${ADT4_FLEETLINK_CAMERAS:-[''"''"''"''"''"''"''"''"''rgb=${ADT4_ROBOT_NAME}_zed/rgb/image_rect_color''"''"''"''"''"''"''"''"'',''"''"''"''"''"''"''"''"''overlay=semantic_overlay/image_raw''"''"''"''"''"''"''"''"'']}" -p topology:=${ADT4_TOPOLOGY:-$ADT4_WS/src/awesome_dcist_t4/network_diagnostics/config/topology.yaml} -p relay_config:=$(ros2 pkg prefix dcist_launch_system)/share/dcist_launch_system/fleetlink/relay.yaml; else echo "fleetlink-agent not started (ADT4_FLEETLINK_MODE=$ADT4_FLEETLINK_MODE, router mode)"; fi''"''"'' exec zsh'''
- window_name: rviz
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_rviz:=true ${ADT4_RVIZ_CONFIG:+rviz_config:=$ADT4_RVIZ_CONFIG}; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_rviz:=true ${ADT4_RVIZ_CONFIG:+rviz_config:=$ADT4_RVIZ_CONFIG}''"''"'' exec zsh'''
- window_name: bag_spot
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_camera_decompression:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_camera_decompression:=true''"''"'' exec zsh'''
