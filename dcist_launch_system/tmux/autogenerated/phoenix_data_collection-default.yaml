nodes_to_monitor:
  tf_network: {}
  gps_monitor:
    external_monitor:
      type: GpsMonitor
  ntrip_monitor:
    external_monitor:
      type: NtripMonitor
  tx_rx_monitor: {}
session_name: adt4_system
suppress_history: false
environment:
  sim_time: $ADT4_SIM_TIME
  ADT4_PRIOR_MAP: $ADT4_PRIOR_MAP
  ADT4_OUTPUT_DIR: $ADT4_OUTPUT_DIR
  HERACLES_NEO4J_USERNAME: $ADT4_NEO4J_USERNAME
  HERACLES_NEO4J_PASSWORD: $ADT4_NEO4J_PASSWORD
  HERACLES_OPENAI_API_KEY: $ADT4_OPENAI_API_KEY
  HERACLES_EVALUATION_PATH: $ADT4_HERACLES_AGENTS_PATH
  ADT4_ORIGIN_UTM: $ADT4_ORIGIN_UTM
  ADT4_TF_NETWORK_MODE: $ADT4_TF_NETWORK_MODE
  ADT4_MONITOR_CONFIG: '{nodes_to_track: {gps_monitor: {external_monitor: {type: GpsMonitor}}, ntrip_monitor: {external_monitor: {type: NtripMonitor}}, tf_network: {}, tx_rx_monitor: {}}}'
  ADT4_ROBOT_NAME: $ADT4_ROBOT_NAME
  config: default
  logging_key: phoenix_data_collection-default
options:
  default-command: /bin/zsh
windows:
- window_name: core
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 service call /${ADT4_ROBOT_NAME}/hydra/shutdown std_srvs/Empty && ros2 service call /${ADT4_ROBOT_NAME}/roman/shutdown std_srvs/Empty''"''"'' ADT4_PANE_PREFILL=1 exec zsh'''
- window_name: status
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 run ros_system_monitor ros_system_monitor --params $ADT4_MONITOR_CONFIG --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r ''"''"''~/table_out:=/global/ros_system_monitor/table_in''"''"''; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 run ros_system_monitor ros_system_monitor --params $ADT4_MONITOR_CONFIG --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r ''"''"''"''"''"''"''"''"''~/table_out:=/global/ros_system_monitor/table_in''"''"''"''"''"''"''"''"''''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true''"''"'' exec zsh'''
- window_name: tf_network
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tf_network:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tf_network:=true''"''"'' exec zsh'''
- window_name: real_phoenix
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; sleep 5; tmux send-keys -t real_phoenix.1 "ros2 launch mit_launch ${ADT4_ROBOT_NAME}_mppi_only.launch.yaml" C-m; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''sleep 5; tmux send-keys -t real_phoenix.1 "ros2 launch mit_launch ${ADT4_ROBOT_NAME}_mppi_only.launch.yaml" C-m''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; cd ${ADT4_PHX_ROOT} && phx run; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''cd ${ADT4_PHX_ROOT} && phx run''"''"'' exec zsh'''
- window_name: sensors
  layout: tiled
  panes:
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_gps:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_gps:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_ntrip:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_ntrip:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_zed:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_zed:=true''"''"'' exec zsh'''
  - shell: 'zsh -ic ''trap : INT; source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tx_rx:=true; _adt4_zd="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $_adt4_zd/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$_adt4_zd; ADT4_PANE_CMD=''"''"''ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tx_rx:=true''"''"'' exec zsh'''
