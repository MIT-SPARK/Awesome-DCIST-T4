---
launch:
  - arg: {name: conf_name}
  - arg: {name: pyenv_path}
  - arg: {name: camera}
  - pyenv_node:
      pkg: roman_ros2
      exec: fastsam_node.py
      name: fastsam_node
      pyenv: $(var pyenv_path)
      param:
        - from: $(find-pkg-share dcist_launch_system)/config/$(var conf_name)/fastsam_node.yaml
          allow_substs: true
        - {name: config_path, value: $(find-pkg-share dcist_launch_system)/config/$(var conf_name)/fastsam.yaml}
      remap:
        - {from: color/camera_info, to: $(var camera)/rgb/camera_info}
        - {from: color/image_raw, to: $(var camera)/rgb/image_rect_color}
        - {from: depth/camera_info, to: $(var camera)/depth_corrected/camera_info}
        - {from: depth/image_raw, to: $(var camera)/depth_corrected/depth_registered}
        - {from: roman/fastsam/status, to: ros_system_monitor/node_diagnostic_collector}
