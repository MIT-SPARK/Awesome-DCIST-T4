---
name: Lint-Awesome-DCIST-T4
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, develop]
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip install pre-commit
          echo "$RUNNER_TEMP/pre-commit/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: pre-commit run --all-files
