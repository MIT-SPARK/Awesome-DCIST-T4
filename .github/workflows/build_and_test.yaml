---
name: Awesome-DCIST-T4
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}
  schedule:
    - cron: 52 23 * * FRI,TUE
env:
  ADT4_WS: ${{ github.workspace }}
  ADT4_ENV: ${{ github.workspace }}
  GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
jobs:
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    outputs:
      need_rebuild: ${{ steps.filter.outputs.need_rebuild }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: src/awesome_dcist_t4
          submodules: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          working-directory: src/awesome_dcist_t4
          filters: |
            need_rebuild:
              - '**'
              - '!*.md'
              - '!scripts/**'
              - '!.gitignore'
              - '!.dotfiles/**'
          predicate-quantifier: every
  Build-and-Test:
    needs: changes
    runs-on: ubuntu-latest
    container: osrf/ros:jazzy-desktop-full
    steps:
      - name: Update Dependencies
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        shell: bash
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          # Fallback for when the Ubuntu mirrors do not resolve (e.g. the Ubuntu DNS outage of
          # 2026-11-11): add public DNS servers and, if that does not help, use the HTTPS
          # kernel.org Ubuntu mirror. Packages stay GPG-verified whichever mirror serves them.
          if ! getent hosts archive.ubuntu.com > /dev/null || ! getent hosts security.ubuntu.com > /dev/null; then
            echo "Ubuntu mirrors do not resolve: adding public DNS servers"
            printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | $SUDO tee -a /etc/resolv.conf > /dev/null || true
            echo 'Acquire::ForceIPv4 "true";' | $SUDO tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            if ! getent hosts archive.ubuntu.com > /dev/null || ! getent hosts security.ubuntu.com > /dev/null; then
              echo "Ubuntu mirrors still do not resolve: using https://mirrors.edge.kernel.org/ubuntu"
              for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
                [ -f "$f" ] || continue
                $SUDO sed -i -E 's#https?://((azure|[a-z]{2})\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' "$f"
              done
            fi
          fi
          $SUDO apt-get -o Acquire::Retries=5 update
          $SUDO apt-get -o Acquire::Retries=5 install -y git python3-pip pipx python3 python3-venv ros-jazzy-ament-cmake wget ccache
      - name: Check out repository code
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        uses: actions/checkout@v4
        with:
          path: src/awesome_dcist_t4
          submodules: false
      - name: CCache
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha}}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.sha}}
            ${{ runner.os }}-ccache-
      - name: Update submodule urls
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        working-directory: src/awesome_dcist_t4
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."https://github.com/".insteadOf git@github.com:
      - name: Update submodules
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        working-directory: src/awesome_dcist_t4
        run: |
          git submodule update --init --recursive
      - name: Setup Workspace
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        shell: bash
        run: |
          vcs import src < src/awesome_dcist_t4/install/packages.yaml
          rosdep update
          rosdep install -q --from-paths src --ignore-src -r -y || echo "Installed rosdeps"
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select config_utilities --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Config Checks
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        shell: bash
        run: ./src/awesome_dcist_t4/dcist_launch_system/scripts/check_configs.sh
      - name: Python Install
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        shell: bash
        run: |
          CMAKE_CXX_COMPILER_LAUNCHER=ccache bash $ADT4_WS/src/awesome_dcist_t4/install/python_setup.bash --no-roman --is-ci
      - name: Build Everything
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Test Python Dependencies
        if: ${{ needs.changes.outputs.need_rebuild == 'true' }}
        shell: bash
        run: |
          source $ADT4_WS/install/setup.bash
          source $ADT4_ENV/spark_env/bin/activate
          python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/test_python_imports.py
      - run: echo "🍏 This job's status is ${{ job.status }}."
